services:
  - type: web
    name: markcoders-share-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        value: MarkcodersAdmin
      - key: ACCOUNT_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
