services:
  # Backend API
  - type: web
    name: markcoders-share-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

  # Frontend (Vite static site)
  - type: web
    name: markcoders-share-web
    runtime: static
    plan: free
    rootDir: AirForShare
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
