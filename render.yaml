services:
  # Backend API
  - type: web
    name: markcoders-share-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

  # Frontend (Vite app served with Node)
  - type: web
    name: markcoders-share-web
    runtime: node
    plan: free
    rootDir: AirForShare
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        sync: false
